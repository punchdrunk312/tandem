[workspace]
members = ["crates/tandem-core", "crates/tandem-cli", "src-tauri"]
# The Tauri app needs WebView2 (Windows); keep plain `cargo test` to the portable crates.
default-members = ["crates/tandem-core", "crates/tandem-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
