[package]
name = "tandem-core"
description = "Tandem core: share one mouse and keyboard (and clipboard, files) between two computers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "fs"] }
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
log = "0.4"
thiserror = "2"
png = { version = "0.17", default-features = false }
ed25519-dalek = "2"
base64 = "0.22"
serde_json = "1"
jpeg-encoder = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSURL", "NSDictionary", "NSAutoreleasePool", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep", "NSWindow", "NSView", "NSResponder", "NSColor", "NSGraphics", "NSRunningApplication", "NSWorkspace"] }
dispatch2 = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
